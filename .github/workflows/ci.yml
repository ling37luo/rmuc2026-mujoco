name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    name: Synthetic fixtures / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Reject bundled third-party field assets
        shell: bash
        run: |
          forbidden="$(find . -type f \( \
            -iname '*.stp' -o -iname '*.step' -o -iname '*.obj' -o \
            -iname '*.glb' -o -iname '*.gltf' -o -iname '*.npz' -o \
            -iname '*.png' -o -iname '*.pdf' -o -iname '*.onnx' -o \
            -iname '*.pt' -o -iname '*.pth' \
          \) -print)"
          if [[ -n "${forbidden}" ]]; then
            echo "Forbidden official-source-derived or model assets are tracked:"
            echo "${forbidden}"
            exit 1
          fi

      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run synthetic-only tests
        env:
          MUJOCO_GL: disable
        run: python -m pytest

  release-contents:
    name: Build and audit release archives
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive builder
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Audit public release contents
        run: python scripts/audit_release_contents.py dist/*
