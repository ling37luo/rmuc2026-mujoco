name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    name: Synthetic fixtures / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Reject bundled third-party assets and generated evidence
        shell: bash
        run: |
          git archive --format=tar \
            --output="${RUNNER_TEMP}/rmuc2026-source-tree.tar" HEAD
          python scripts/audit_release_contents.py \
            "${RUNNER_TEMP}/rmuc2026-source-tree.tar"

      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run synthetic-only tests
        env:
          MUJOCO_GL: disable
        run: python -m pytest

  release-contents:
    name: Build and audit release archives
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install archive builder
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Audit public release contents
        run: python scripts/audit_release_contents.py dist/*
